<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1b2d">
  <meta name="description" content="Turn finished jobs into branded before & after social posts.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Spotlight">
  <title>Project Spotlight</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="preload" href="./fonts/inter-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="./fonts/anton.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="./css/app.css">
</head>
<body>
  <div class="app">
    <header id="appbar" class="appbar"></header>
    <main id="view" class="view">
      <div class="boot"><img src="./icons/icon.svg" alt="" width="64" height="64"><p>Loading…</p></div>
    </main>
    <nav id="tabbar" class="tabbar" hidden aria-label="Main">
      <a href="#/" data-tab="projects"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg><span>Projects</span></a>
      <a href="#/clients" data-tab="clients"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg><span>Clients</span></a>
      <a href="#/settings" data-tab="settings"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7h-9"/><path d="M14 17H5"/><circle cx="17" cy="17" r="3"/><circle cx="7" cy="7" r="3"/></svg><span>Settings</span></a>
    </nav>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <noscript><p style="padding:24px">Project Spotlight needs JavaScript enabled.</p></noscript>
  <script>
    // Show a readable message instead of a blank screen if the app fails to start.
    window.addEventListener('error', function (e) {
      if (document.documentElement.classList.contains('ready')) return;
      var v = document.getElementById('view');
      if (v) v.innerHTML = '<div class="boot"><p><b>Project Spotlight could not start.</b><br>' + (e.message || 'Unknown error') + '</p><p>Try reloading. This app needs a current version of Safari, Chrome, Edge or Firefox.</p></div>';
    });
  </script>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
